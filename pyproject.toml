[project]
name = "g2c"
version = "0.1.0"
description = "g2c — GTX-to-C Compiler: PyTorch 모델 변환 및 최적화 툴킷"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm",
    "ultralytics",
    "networkx",            # shared/inspector SubgraphMatcher (fused op 패턴 매칭)
]

[project.scripts]
g2c = "shared.compile.pipeline:main"

[tool.setuptools.packages.find]
include = [
    "g2c*", "shared*", "parse*", "qproc*", "quantization*", "utils*", "nn*",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true