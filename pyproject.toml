[project]
name = "gtx_compiler"
version = "0.1.0"
description = "GTX Compiler: PyTorch 모델 변환 및 최적화 툴킷"
# authors = ["Sudo42b sw.lee@supergate.cc"]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["gtx_shared", "parse", "qproc", "quantization", "gtx_utils", "nn", "fx"]

[project.optional-dependencies]
torch = ["torch>=1.8.0", "torchvision>=0.9.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
